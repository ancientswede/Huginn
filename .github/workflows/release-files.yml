name: Release files

# Attaches the Debian package and the download-only Docker files to a published release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.21.2
        required: true

permissions:
  contents: write
  id-token: write       # signing (Sigstore, no key to keep)
  attestations: write

jobs:
  files:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Before any code from that ref runs with this job's write token: a version tag with a published release, checked
      # out as that exact tag, never a branch of the same name (Codex rc2 M8).
      - name: The tag is a released version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName | grep -qx "$TAG"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: The tag and the code agree
        run: |
          ver=$(sed -nE 's/^HUGINN_VERSION = "([^"]+)".*/\1/p' app.py | head -1)
          [ "v$ver" = "$TAG" ]
      - name: Build
        run: tools/build-release.sh dist
      - name: The package has that version
        run: |
          ver=${TAG#v}
          [ "$(dpkg-deb -f dist/huginn_all.deb Version)" = "${ver/-rc/~rc}" ]
      - name: Compose file is valid
        run: |
          cp dist/huginn.env.example dist/.env
          docker compose -f dist/docker-compose.yml config -q
          rm dist/.env
      - name: Package installs
        run: |
          sudo apt-get install -y ./dist/huginn_all.deb
          test -x /usr/sbin/huginn-setup
          sudo huginn-setup --help
      - name: Sign (build provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/huginn_all.deb
            dist/docker-compose.yml
            dist/huginn.env.example
            dist/SHA256SUMS
      - name: Upload
        run: gh release upload "$TAG" dist/huginn_all.deb dist/docker-compose.yml dist/huginn.env.example dist/SHA256SUMS --clobber
